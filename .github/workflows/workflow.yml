name: CI/CD

# Single canonical workflow. Jobs:
#   - ci: main build/test/publish pipeline (former sole workflow.yml job)
#   - repo-audit: ganda repo audit (runfile +x, shebang, TW0007, kebab, …)
#   - skill-lint: vally skill/eval lint (former skill-lint.yaml; PR + path filter)
#   - template-smoke: pack → install → generate → build (former template-smoke.yml)
# Path semantics from the former separate workflows are preserved via detect-paths
# + job-level if conditions (not separate workflow files).

on:
  push:
    branches:
      - master
      - feature/overnight
    paths:
      - 'source/**'
      - 'tests/**'
      - 'timewarp-templates/**'
      - '.template.config/**'
      - 'tools/**'
      - 'msbuild/**'
      - '.github/workflows/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'timewarp-architecture.slnx'
      - '.editorconfig'
      - '.githooks/**'
      - '**/SKILL.md'
      - '**/eval.yaml'
      - '.vally.yaml'
      - 'evals/**'
      - 'skills/**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
    branches:
      - master
      - feature/overnight
    paths:
      - 'source/**'
      - 'tests/**'
      - 'timewarp-templates/**'
      - '.template.config/**'
      - 'tools/**'
      - 'msbuild/**'
      - '.github/workflows/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'timewarp-architecture.slnx'
      - '.editorconfig'
      - '.githooks/**'
      - '**/SKILL.md'
      - '**/eval.yaml'
      - '.vally.yaml'
      - 'evals/**'
      - 'skills/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: 'merge = normal CI (default). probe = trusted-publishing check only (OIDC login, no build, no publish).'
        type: choice
        options:
          - merge
          - probe
        default: merge

jobs:
  detect-paths:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      skill: ${{ steps.filter.outputs.skill }}
      template: ${{ steps.filter.outputs.template }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then
            # New branch / unknown base — run all path-gated jobs that apply.
            echo "ci=true" >> "$GITHUB_OUTPUT"
            echo "skill=true" >> "$GITHUB_OUTPUT"
            echo "template=true" >> "$GITHUB_OUTPUT"
            echo "No usable base SHA — enabling all path-gated jobs."
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD" || true)
          echo "Changed files:"
          echo "$changed"

          ci=false
          skill=false
          template=false

          if echo "$changed" | grep -Eq '^(source/|tests/|timewarp-templates/|\.template\.config/|tools/|msbuild/|\.github/workflows/|Directory\.Build\.props|Directory\.Packages\.props)'; then
            ci=true
          fi

          if echo "$changed" | grep -Eq '(^|/)SKILL\.md$|(^|/)eval\.yaml$|^\.vally\.yaml$|^evals/|^skills/|\.github/workflows/'; then
            skill=true
          fi

          if echo "$changed" | grep -Eq '^(source/|tests/|timewarp-templates/|\.template\.config/|msbuild/|Directory\.Build\.props|Directory\.Packages\.props|timewarp-architecture\.slnx|tools/dev-cli/|\.github/workflows/)'; then
            template=true
          fi

          echo "ci=$ci" >> "$GITHUB_OUTPUT"
          echo "skill=$skill" >> "$GITHUB_OUTPUT"
          echo "template=$template" >> "$GITHUB_OUTPUT"
          echo "ci=$ci skill=$skill template=$template"

  repo-audit:
    # Guard for runfile-executable / shebang / TW0007 / kebab / memsearch / peacock.
    # TimeWarp.Ganda current versions live only on GitHub Packages (nuget.org tops out at
    # 1.0.0-beta.15 and lacks later checks). Install from github only — fail closed rather
    # than soft-fallback to the public feed (review M1).
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install ganda
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          config="$(mktemp)"
          cat > "$config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="github" value="https://nuget.pkg.github.com/TimeWarpEngineering/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <github>
                <add key="Username" value="${NUGET_USER}" />
                <add key="ClearTextPassword" value="${GITHUB_TOKEN}" />
              </github>
            </packageSourceCredentials>
          </configuration>
          EOF
          dotnet tool install --global TimeWarp.Ganda --prerelease --configfile "$config"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          export PATH="$HOME/.dotnet/tools:$PATH"
          version="$(ganda --version | head -1)"
          echo "installed ganda: $version"
          # nuget.org TimeWarp.Ganda tops out at 1.0.0-beta.15; refuse a public-feed install.
          case "$version" in
            *1.0.0-beta.1[0-5]*|*1.0.0-beta.[0-9][+]*|*1.0.0-beta.[0-9])
              echo "ganda $version is nuget.org-vintage; GitHub Packages did not supply a current tool." >&2
              exit 1
              ;;
          esac

      - name: ganda repo audit
        run: ganda repo audit

  ci:
    needs: [detect-paths]
    if: |
      always() && !cancelled() && (
        github.event_name == 'release' ||
        github.event_name == 'workflow_dispatch' ||
        needs.detect-paths.outputs.ci == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for NuGet Trusted Publishing (OIDC)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for SourceLink / version metadata

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Integration tests hit the servers over HTTPS with the ASP.NET dev certificate; trust it so the
      # runner's HttpClient doesn't fail with UntrustedRoot (passes locally only because the dev box
      # already trusts it). On Linux, `--trust` writes the cert to ~/.aspnet/dev-certs/trust and exits
      # 4 ("trusted by some clients") — OpenSSL (HttpClient) only honours it once that dir is on
      # SSL_CERT_DIR (set on the Run CI Pipeline step below). See https://aka.ms/dev-certs-trust.
      - name: Trust HTTPS dev certificate
        if: github.event_name != 'release'
        run: dotnet dev-certs https --trust || true

      - name: NuGet login (OIDC Trusted Publishing)
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'probe')
        id: nuget-login
        uses: nuget/login@v1
        with:
          user: TimeWarp.Enterprises

      - name: Trusted publishing probe result
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
        run: echo "Trusted publishing OK — OIDC exchange succeeded for this repo + workflow.yml. (A failure of the NuGet login step above means the policy is missing or misconfigured on NuGet.org.)"

      - name: Run CI Pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'probe'
        run: |
          # Make OpenSSL (the runner's HttpClient) honour the trusted dev cert (see Trust step above).
          export SSL_CERT_DIR="$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs:/etc/ssl/certs"
          if [ "${{ github.event_name }}" == "release" ]; then
            dotnet run tools/dev-cli/dev.cs -- workflow --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          else
            dotnet run tools/dev-cli/dev.cs -- workflow
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Packages-${{ github.run_number }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: ignore
          # Org Free-plan cap is 500 MB shared Actions storage. 3 days covers a
          # weekend between merge and `dev release`. A cut after expiry needs
          # `gh run rerun <ci-run-id>` first (tw-release expired-artifact remedy).
          # Any future diagnostic upload (smoke logs, test results) must set
          # retention-days: 1. Do not rename Packages-*; locate-run depends on it.
          retention-days: 3

  skill-lint:
    # Former skill-lint.yaml — PR only, skill/eval path filter via detect-paths.
    needs: [detect-paths]
    if: |
      always() && !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.detect-paths.outputs.skill == 'true'
    name: Lint skill specs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install vally CLI
        run: npm install -g @microsoft/vally-cli

      - name: Lint all skills
        run: vally lint skills

      - name: Lint eval specs
        run: |
          for spec in skills/*/evals/eval.yaml; do
            [ -f "$spec" ] || continue
            echo "Linting $spec"
            vally lint --eval-spec "$spec"
          done

  template-smoke:
    # Former template-smoke.yml — push/PR path filter + workflow_dispatch.
    needs: [detect-paths]
    if: |
      always() && !cancelled() && (
        (github.event_name == 'workflow_dispatch' && inputs.mode != 'probe') ||
        (
          (github.event_name == 'push' || github.event_name == 'pull_request') &&
          needs.detect-paths.outputs.template == 'true'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Generated-app Jaribu aggregators hit HTTPS with the ASP.NET dev certificate (same as the
      # main `ci` job). Trust it and put the trust dir on SSL_CERT_DIR so OpenSSL/HttpClient does
      # not fail with UntrustedRoot on Linux runners. See https://aka.ms/dev-certs-trust.
      - name: Trust HTTPS dev certificate
        run: dotnet dev-certs https --trust || true

      - name: Template smoke (pack → install → generate → build)
        run: |
          export SSL_CERT_DIR="$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs:/etc/ssl/certs"
          dotnet run tools/dev-cli/dev.cs -- template-smoke
