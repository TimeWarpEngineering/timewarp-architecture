name: CI/CD

# Thin trigger: this file says when to run and on which runner. Every decision and check is
# `dev workflow` (tools/dev-cli/endpoints/workflow-command.cs, Design region); shared runner setup
# is .github/actions/setup-ci. Jobs:
#   classify        ci / skill / template outputs from `dev workflow --phase classify`
#   ci-group        ci (fast), ci (integration), ci (publish): one `dev workflow` phase each
#   pack-only       a master push whose ci-group is off: carry forward or build and pack (task 533)
#   ci              the required check over ci-group and pack-only; on master it publishes
#                   Packages-<run_number> and keeps the two newest
#   release         release event and break-glass dispatch: promote the master run's Packages-*
#                   (tag-gate, check-version, locate-run, download, verify, OIDC push), then
#                   template-publish-smoke. One job, never a matrix.
#   skill-lint      `dev lint-skills` at the vally pin
#   template-smoke  pack, install, generate, build; the nightly runs the flag-off matrix
#   green-key       uploads a green-key marker for each gate that passed (task 504)
#
# This is the template repository's own workflow and does not ship. A generated app gets
# .github/app-workflows/workflow.yml (task 531): classify, ci-group, ci, and green-key for the ci
# gate, on hosted runners unless that repository sets CI_RUNNER_LABELS. setup-ci ships to both.
#
# Runner (task 504, as timewarp-nuru 539). A push, or a pull request whose head branch lives in this
# repo, runs classify, ci-group, and skill-lint on the wslc container runners on TWE-001 (labels
# self-hosted, twe-001, wslc; org runner group 3, which allows this public repo:
# timewarp-infrastructure 004). Everything else stays on ubuntu-latest: fork pull requests (untrusted
# code), release, schedule, workflow_dispatch, and the small ci and green-key jobs. ci (integration)
# and template-smoke stay hosted on every event: Testcontainers and aspire-tests need a Docker
# daemon, and the wslc image has no Docker socket. template-smoke runs the generated app's
# web-jaribu-tests, whose feedback tests use Testcontainers Postgres (task 522). A fork pull request runs its own copy of this file and can rewrite
# runs-on, so the real gate is the fork pull request approval setting (all_external_contributors):
# approvers read the workflow diff before approving. Set the repository variable CI_HOSTED_ONLY to
# true to send every run to ubuntu-latest (runners offline) without a code change.
#
# Green key (task 504, as timewarp-ganda 469 and 470). Classify hashes the committed tree (minus
# kanban task content), the SDK, and the runner into a key, and turns off ci-group, skill-lint, or
# template-smoke when that gate already passed on the same key in an earlier same-repo run. So a
# master merge push, or a kanban-only push to a green pull request, does not run CI again. The
# green-key job uploads a marker per gate after it passes. Rules: tools/dev-cli/services/green-key.cs.
# Fork pull requests, release, schedule, and workflow_dispatch never skip. To force a full run, add
# the trailer `Green-Key: full-run` to the head commit, or dispatch this workflow with mode full.
#
# Packages (task 533, as timewarp-nuru and timewarp-ganda 470 and 711). Every master push CI accepts
# ends with Packages-<run_number>: the 12 packages of `dev workflow` (ArchitecturePackableProjectService),
# built and verified once on that commit. The release job promotes those bytes; it never rebuilds.
# classify writes packages=true for a push or dispatch on master only, so a pull request uploads no
# Packages-*. With ci-group on, ci (publish) packs after publish all (`--pack`). With ci-group off (a
# green-key hit, usually the merge of a green pull request, or a skills-only push, which still changes
# the template package), pack-only runs: it carries forward a live Packages-* of an earlier non-PR run
# with the same green key (classify's carry_run), else builds and packs this commit. Either job
# uploads staged-packages; ci republishes it as Packages-<run_number> (3 days: the org's 500 MB
# Actions storage cap), deletes Packages-* older than the two newest, and deletes staged-packages.
# pack-only writes no green-key marker. Rules: tools/dev-cli/services/release-packages.cs.

on:
  push:
    branches:
      - master
      - 'feature/**'
    # A kanban-only or docs-only push gets no run. Required checks gate pull requests, not
    # pushes, so nothing waits on a push this filter skips.
    paths:
      - 'source/**'
      - 'tests/**'
      - 'timewarp-templates/**'
      - '.template.config/**'
      - 'tools/**'
      - 'msbuild/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'timewarp-architecture.slnx'
      - '**/SKILL.md'
      - '**/eval.yaml'
      - '.vally.yaml'
      - 'evals/**'
      - 'skills/**'
      - 'goldens/**'
  # No paths filter: every pull request reports `ci`. A non-build pull request skips build and
  # test through PullRequestBuildClassifier, and the skipped ci-group reports success.
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - 'feature/**'
  release:
    types: [published]
  schedule:
    - cron: '17 7 * * *'  # nightly template-smoke flag-off matrix, 07:17 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = every CI job on hosted runners, no green-key skip; on master it also publishes Packages-* (default). release = break-glass publish of this ref''s Packages-*; also requires confirm. probe = trusted-publishing check only (OIDC login, no build, no publish). nightly = template-smoke flag-off matrix + generated-app tests only.'
        type: choice
        options:
          - full
          - release
          - probe
          - nightly
        default: full
      confirm:
        description: 'Break-glass guard: type the word release to confirm publishing when mode is release. Ignored otherwise.'
        type: string
        default: ''

# A newer pull request run, or a newer push to the same branch, cancels the older one. Release,
# dispatch, and schedule runs get a group of their own (run_id) and are never cancelled.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
    github.event_name == 'push' && format('push-{0}', github.ref) ||
    format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

defaults:
  run:
    shell: pwsh

jobs:
  classify:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
    runs-on: >-
      ${{ vars.CI_HOSTED_ONLY != 'true' &&
      (github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) &&
      fromJSON('["self-hosted", "twe-001", "wslc"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: read  # green-key marker and carry-forward lookup (gh api actions/artifacts)
    outputs:
      # A classify step that wrote nothing turns the job on.
      ci: ${{ steps.classify.outputs.ci || 'true' }}
      skill: ${{ steps.classify.outputs.skill || 'true' }}
      template: ${{ steps.classify.outputs.template || 'true' }}
      green_key: ${{ steps.classify.outputs.green_key }}
      green_key_writer: ${{ steps.classify.outputs.green_key_writer || 'false' }}
      # Master packages (task 533). A classify step that wrote nothing stages nothing.
      packages: ${{ steps.classify.outputs.packages || 'false' }}
      pack: ${{ steps.classify.outputs.pack || 'false' }}
      carry_run: ${{ steps.classify.outputs.carry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}  # base...head needs the merge base

      - uses: ./.github/actions/setup-ci
        with:
          nuget-cache: restore  # only the dev CLI's packages; a ci-group job saves the full set

      - name: Classify changed paths and look up green keys
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --file tools/dev-cli/dev.cs -- workflow --phase classify

  ci-group:
    needs: [classify]
    if: |
      always() && !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')) &&
      needs.classify.outputs.ci == 'true'
    name: ci (${{ matrix.name }})
    # matrix.hosted keeps a leg on ubuntu-latest on every event (see the header).
    runs-on: >-
      ${{ vars.CI_HOSTED_ONLY != 'true' && !matrix.hosted &&
      (github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) &&
      fromJSON('["self-hosted", "twe-001", "wslc"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fast
            args: --phase test --group fast
          - name: integration
            args: --phase test --group integration
            hosted: true  # Testcontainers and aspire-tests need Docker; wslc has no socket
          - name: publish
            args: --phase publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-ci
        with:
          dev-certs: 'true'
          aspire-cli: 'true'

      # On a master run the publish leg also packs and verifies the 12 packages (task 533).
      - name: Run CI pipeline
        run: dotnet run --file tools/dev-cli/dev.cs -- workflow ${{ matrix.args }}${{ matrix.name == 'publish' && needs.classify.outputs.packages == 'true' && ' --pack' || '' }}

      - name: Stage packages for the ci job
        if: success() && matrix.name == 'publish' && needs.classify.outputs.packages == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: staged-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 3

      - name: Upload coverage
        if: success() && matrix.name != 'publish'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.name }}
          path: artifacts/coverage
          if-no-files-found: warn

  pack-only:
    # A master run whose ci-group is off still publishes Packages-* (see the header). No test step:
    # the tree already passed ci on this green key, or the push changed only skills.
    needs: [classify]
    if: |
      always() && !cancelled() &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.pack == 'true'
    runs-on: >-
      ${{ vars.CI_HOSTED_ONLY != 'true' && github.event_name == 'push' &&
      fromJSON('["self-hosted", "twe-001", "wslc"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: read  # carry forward: gh lists and downloads the earlier run's Packages-*
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-ci
        with:
          nuget-cache: restore

      - name: Pack this commit or carry forward
        env:
          GH_TOKEN: ${{ github.token }}
          CARRY_RUN: ${{ needs.classify.outputs.carry_run }}
        run: |
          if ($env:CARRY_RUN) {
            dotnet run --file tools/dev-cli/dev.cs -- workflow --phase pack --carry-run $env:CARRY_RUN
          } else {
            dotnet run --file tools/dev-cli/dev.cs -- workflow --phase pack
          }
          exit $LASTEXITCODE

      - name: Stage packages for the ci job
        uses: actions/upload-artifact@v7
        with:
          name: staged-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 3

  ci:
    # The required check. A skipped ci-group (non-build change) passes; a failed or cancelled
    # group fails. A failed classify fails too: its skip of ci-group must not read as a pass.
    # pack-only must pass or skip the same way.
    needs: [classify, ci-group, pack-only]
    if: always() && (github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # delete Packages-* older than the two newest, and this run's staged-packages
    steps:
      - name: All CI groups passed
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          GROUP_RESULT: ${{ needs.ci-group.result }}
          PACK_RESULT: ${{ needs.pack-only.result }}
        run: |
          Write-Host "classify: $env:CLASSIFY_RESULT ci-group: $env:GROUP_RESULT pack-only: $env:PACK_RESULT"
          if ($env:CLASSIFY_RESULT -ne 'success') { exit 1 }
          if ($env:GROUP_RESULT -ne 'success' -and $env:GROUP_RESULT -ne 'skipped') { exit 1 }
          if ($env:PACK_RESULT -ne 'success' -and $env:PACK_RESULT -ne 'skipped') { exit 1 }

      # Master only (classify packages=true): publish the staged packages under the name the release
      # job's locate-run and `dev release` look for. Do not rename Packages-*.
      - name: Download staged packages
        if: success() && needs.classify.outputs.packages == 'true'
        uses: actions/download-artifact@v8
        with:
          name: staged-packages
          path: artifacts/packages

      - name: Upload Packages
        id: upload-packages
        if: success() && needs.classify.outputs.packages == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Packages-${{ github.run_number }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 3

      - name: Keep the two newest Packages artifacts
        # A listing that lags the upload prunes on the next green master run instead. Other artifact
        # names (coverage, green-key markers) are left alone.
        if: success() && steps.upload-packages.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT: Packages-${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $query = '.artifacts[] | select((.name | startswith("Packages-")) and (.expired == false)) | {created_at, id, name} | tojson'
          $listed = gh api --paginate "/repos/$($env:GITHUB_REPOSITORY)/actions/artifacts?per_page=100" --jq $query
          if ($LASTEXITCODE -ne 0) { throw 'gh api failed to list the Actions artifacts.' }
          $artifacts = @($listed | Where-Object { $_ } | ForEach-Object { $_ | ConvertFrom-Json })
          if (-not ($artifacts | Where-Object { $_.name -eq $env:EXPECTED_ARTIFACT })) {
            Write-Output "$($env:EXPECTED_ARTIFACT) is not listed yet; the next green master run prunes."
            exit 0
          }
          $keep = 2
          $sorted = @($artifacts | Sort-Object -Property @{ Expression = { [datetime]$_.created_at }; Descending = $true }, @{ Expression = { [long]$_.id }; Descending = $true })
          for ($index = 0; $index -lt $sorted.Count; $index++) {
            $artifact = $sorted[$index]
            if ($index -lt $keep) {
              Write-Output "Keeping $($artifact.name) (id=$($artifact.id), created=$($artifact.created_at))"
              continue
            }
            Write-Output "Deleting $($artifact.name) (id=$($artifact.id), created=$($artifact.created_at))"
            gh api --method DELETE "/repos/$($env:GITHUB_REPOSITORY)/actions/artifacts/$($artifact.id)" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Delete of $($artifact.name) (id=$($artifact.id)) failed." }
          }

      - name: Delete staged packages
        if: success() && steps.upload-packages.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ids = @(gh api "/repos/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:RUN_ID)/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "staged-packages") | .id' | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw 'gh api failed to list the run artifacts.' }
          foreach ($id in $ids) {
            Write-Output "Deleting staged-packages (id=$id)"
            gh api --method DELETE "/repos/$($env:GITHUB_REPOSITORY)/actions/artifacts/$id" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Delete of staged-packages (id=$id) failed." }
          }

  release:
    # NuGet Trusted Publishing binds to this repo + workflow.yml, not the job name. Promotes the
    # Packages-* the master run built and tested at this commit; no clean, build, test, or upload.
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'release' || inputs.mode == 'probe'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # NuGet Trusted Publishing (OIDC)
      actions: read    # locate-run lists runs and downloads the Packages-* artifact
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tag pin, ancestor of origin/master, and the attestation notes need full history

      - name: Validate break-glass confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.confirm != 'release'
        run: |
          echo "::error::mode=release requires confirm=release. Refusing to run a break-glass release."
          exit 1

      - uses: ./.github/actions/setup-ci
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'probe'
        with:
          nuget-cache: restore  # nothing a release restores seeds a later run
          aspire-cli: 'true'    # template-publish-smoke builds the generated app

      - name: NuGet login (OIDC Trusted Publishing)
        id: nuget-login
        uses: nuget/login@v1
        with:
          user: TimeWarp.Enterprises

      - name: Trusted publishing probe result
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
        run: echo "Trusted publishing OK — OIDC exchange succeeded for this repo + workflow.yml. (A failure of the NuGet login step above means the policy is missing or misconfigured on NuGet.org.)"

      - name: Run release pipeline
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.confirm == 'release')
        env:
          GH_TOKEN: ${{ github.token }}
          NUGET_LOGIN_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            dotnet run --file tools/dev-cli/dev.cs -- workflow --api-key $env:NUGET_LOGIN_API_KEY
          } else {
            dotnet run --file tools/dev-cli/dev.cs -- workflow --mode release --api-key $env:NUGET_LOGIN_API_KEY
          }
          exit $LASTEXITCODE

  skill-lint:
    needs: [classify]
    if: |
      always() && !cancelled() &&
      (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')) &&
      needs.classify.outputs.skill == 'true'
    name: Lint skill specs
    runs-on: >-
      ${{ vars.CI_HOSTED_ONLY != 'true' &&
      (github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) &&
      fromJSON('["self-hosted", "twe-001", "wslc"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: ./.github/actions/setup-ci
        with:
          nuget-cache-key: skill-lint

      - name: Install vally CLI
        run: |
          $ErrorActionPreference = 'Stop'
          # One assignment: dev-cli checks that this line reads tools/dev-cli/vally-cli.version.
          $version=(Get-Content -Raw tools/dev-cli/vally-cli.version) -replace '\s',''
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Host 'tools/dev-cli/vally-cli.version is missing or empty.'
            exit 1
          }
          Write-Host "Installing @microsoft/vally-cli@$version from tools/dev-cli/vally-cli.version"
          npm install -g "@microsoft/vally-cli@$version"
          exit $LASTEXITCODE

      - name: Lint skill specs
        run: dotnet run --file tools/dev-cli/dev.cs -- lint-skills

  template-smoke:
    needs: [classify]
    if: |
      always() && !cancelled() && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.mode != 'probe' && inputs.mode != 'release') ||
        ((github.event_name == 'push' || github.event_name == 'pull_request') && needs.classify.outputs.template == 'true')
      )
    # Hosted on every event: the generated app's tests use Testcontainers (see the header).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-ci
        with:
          nuget-cache-key: template-smoke  # the generated app's package set, not the monorepo's
          dev-certs: 'true'
          aspire-cli: 'true'

      # Nightly: every flag-off variant plus each generated app's tests. Otherwise SmokeDefault only.
      - name: Template smoke (pack → install → generate → build)
        env:
          NIGHTLY: ${{ github.event_name == 'schedule' || inputs.mode == 'nightly' }}
        run: |
          if ($env:NIGHTLY -eq 'true') {
            dotnet run --file tools/dev-cli/dev.cs -- template-smoke --matrix --app-tests
          } else {
            dotnet run --file tools/dev-cli/dev.cs -- template-smoke
          }
          exit $LASTEXITCODE

      # The smoke restores this branch's 2.0.0-smoke packages. Evict them before the cache
      # post-step saves, so no cache carries one branch's local bits into another run.
      - name: Evict smoke packages from NuGet cache
        if: always()
        run: rm -rf ~/.nuget/packages/*/2.0.0-smoke

  green-key:
    # Uploads one marker per gate that passed on this run's key (green-key-v1-<gate>-<key>, see
    # tools/dev-cli/services/green-key.cs). green_key_writer is true only for a same-repo push or pull
    # request whose classify computed a key. A gate that skipped (path rule or green-key hit) or
    # failed uploads nothing. 90 days matches timewarp-ganda; a marker is one small file.
    needs: [classify, ci-group, skill-lint, template-smoke]
    if: |
      always() && !cancelled() &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.green_key_writer == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Stage marker
        env:
          GREEN_KEY: ${{ needs.classify.outputs.green_key }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/green-key | Out-Null
          [ordered]@{ format = 'green-key-v1'; key = $env:GREEN_KEY; run = $env:GITHUB_RUN_ID; commit = $env:GITHUB_SHA } |
            ConvertTo-Json -Compress | Set-Content -Path artifacts/green-key/marker.json

      - name: Upload ci marker
        if: needs.ci-group.result == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: green-key-v1-ci-${{ needs.classify.outputs.green_key }}
          path: artifacts/green-key/marker.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload skill marker
        if: needs.skill-lint.result == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: green-key-v1-skill-${{ needs.classify.outputs.green_key }}
          path: artifacts/green-key/marker.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload template marker
        if: needs.template-smoke.result == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: green-key-v1-template-${{ needs.classify.outputs.green_key }}
          path: artifacts/green-key/marker.json
          if-no-files-found: error
          retention-days: 90
