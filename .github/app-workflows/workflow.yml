name: CI

# The generated app's CI (task 531). Thin trigger: this file says when to run and on which runner.
# Every decision and check is `dev workflow` (tools/dev-cli/endpoints/workflow-command.cs, Design
# region); shared runner setup is .github/actions/setup-ci. Jobs:
#   classify   the ci output and the green key from `dev workflow --phase classify`
#   ci-group   ci (fast), ci (integration), ci (publish): one `dev workflow` phase each. publish runs
#              `dev publish all` and the production-safety suites over its outputs; nothing deploys
#   ci         the required check over ci-group. Make `ci` the required status check on the default
#              branch: `ganda pr merge` waits for it
#   green-key  uploads a green-key marker after ci-group passes
#   deploy     a published release, or a dispatch with deploy on, deploys the app to Azure.
#              A merge never deploys. On a deploy run the CI jobs above do not run. Setup (Azure
#              OIDC login, the Production environment, variables and secrets) is in the tw-deploy
#              skill, references/release-deploy.md
#
# Runner. Every job runs on ubuntu-latest by default. To run classify, ci (fast), and ci (publish) on
# self-hosted runners, set the repository variable CI_RUNNER_LABELS to a JSON array of runner labels,
# for example ["self-hosted", "linux"]. Only a push, or a pull request whose head branch lives in
# this repository, uses them: a fork pull request runs untrusted code on hosted runners. ci
# (integration) stays hosted on every event, because Testcontainers and aspire-tests need a Docker
# daemon. Delete the variable to go back to hosted runners without a code change.
#
# Green key. Classify hashes the committed tree (minus kanban task content), the SDK, and the runner
# into a key, and turns off ci-group when it already passed on the same key in an earlier same-repo
# run. So the push that merges a green pull request, or a kanban-only push, does not run CI again.
# Rules: tools/dev-cli/services/green-key.cs. Fork pull requests and workflow_dispatch never skip.
# To force a full run, add the trailer `Green-Key: full-run` to the head commit, or dispatch this
# workflow.

on:
  push:
    branches:
      - master
      - main
      - 'feature/**'
    # A kanban-only or docs-only push gets no run. Required checks gate pull requests, not pushes,
    # so nothing waits on a push this filter skips.
    paths:
      - 'source/**'
      - 'tests/**'
      - 'tools/**'
      - 'msbuild/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.timewarp/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - '*.slnx'
      - 'global.json'
      - '.editorconfig'
      - 'BannedSymbols.txt'
      - 'aspire.config.json'
  # No paths filter: every pull request reports `ci`. `ganda pr merge` treats a branch as
  # CI-configured when a workflow triggers on pull_request, and refuses a pull request that
  # registers no check. A non-build pull request skips ci-group, and the skipped ci-group passes.
  pull_request:
    types: [opened, synchronize, reopened]
  # A published release deploys (the deploy job). It runs no CI: the release's commit passed CI on
  # its pull request.
  release:
    types: [published]
  # A manual run is a full run on hosted runners: no green-key skip. With deploy on, it deploys the
  # chosen ref instead and runs no CI.
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this ref to Azure instead of running CI
        type: boolean
        default: false

# A newer pull request run, or a newer push to the same branch, cancels the older one. A dispatch
# gets a group of its own (run_id) and is never cancelled.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
    github.event_name == 'push' && format('push-{0}', github.ref) ||
    format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

defaults:
  run:
    shell: pwsh

jobs:
  classify:
    if: github.event_name != 'release' && !inputs.deploy
    runs-on: >-
      ${{ vars.CI_RUNNER_LABELS != '' &&
      (github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) &&
      fromJSON(vars.CI_RUNNER_LABELS) || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: read  # green-key marker lookup (gh api actions/artifacts)
    outputs:
      # A classify step that wrote nothing turns ci-group on.
      ci: ${{ steps.classify.outputs.ci || 'true' }}
      green_key: ${{ steps.classify.outputs.green_key }}
      green_key_writer: ${{ steps.classify.outputs.green_key_writer || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}  # base...head needs the merge base

      - uses: ./.github/actions/setup-ci
        with:
          nuget-cache: restore  # only the dev CLI's packages; a ci-group job saves the full set

      - name: Classify changed paths and look up the green key
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --file tools/dev-cli/dev.cs -- workflow --phase classify

  ci-group:
    needs: [classify]
    if: always() && !cancelled() && needs.classify.outputs.ci == 'true'
    name: ci (${{ matrix.name }})
    # matrix.hosted keeps a leg on ubuntu-latest on every event (see the header).
    runs-on: >-
      ${{ vars.CI_RUNNER_LABELS != '' && !matrix.hosted &&
      (github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) &&
      fromJSON(vars.CI_RUNNER_LABELS) || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fast
            args: --phase test --group fast
          - name: integration
            args: --phase test --group integration
            hosted: true  # Testcontainers and aspire-tests need Docker
          - name: publish
            args: --phase publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-ci
        with:
          dev-certs: 'true'
          aspire-cli: 'true'

      - name: Run CI pipeline
        run: dotnet run --file tools/dev-cli/dev.cs -- workflow ${{ matrix.args }}

      - name: Upload coverage
        if: success() && matrix.name != 'publish'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.name }}
          path: artifacts/coverage
          if-no-files-found: warn

  ci:
    # The required check. A skipped ci-group (non-build change or green-key hit) passes; a failed or
    # cancelled group fails. A failed classify fails too: its skip of ci-group must not read as a pass.
    # A deploy run has no CI, so no ci check.
    needs: [classify, ci-group]
    if: always() && github.event_name != 'release' && !inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - name: All CI groups passed
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          GROUP_RESULT: ${{ needs.ci-group.result }}
        run: |
          Write-Host "classify: $env:CLASSIFY_RESULT ci-group: $env:GROUP_RESULT"
          if ($env:CLASSIFY_RESULT -ne 'success') { exit 1 }
          if ($env:GROUP_RESULT -ne 'success' -and $env:GROUP_RESULT -ne 'skipped') { exit 1 }

  green-key:
    # Uploads the ci marker (green-key-v1-ci-<key>, see tools/dev-cli/services/green-key.cs) when
    # ci-group passed on this run's key. green_key_writer is true only for a same-repo push or pull
    # request whose classify computed a key and left ci-group on. A marker is one small file.
    needs: [classify, ci-group]
    if: |
      always() && !cancelled() &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.green_key_writer == 'true' &&
      needs.ci-group.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Stage marker
        env:
          GREEN_KEY: ${{ needs.classify.outputs.green_key }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/green-key | Out-Null
          [ordered]@{ format = 'green-key-v1'; key = $env:GREEN_KEY; run = $env:GITHUB_RUN_ID; commit = $env:GITHUB_SHA } |
            ConvertTo-Json -Compress | Set-Content -Path artifacts/green-key/marker.json

      - name: Upload ci marker
        uses: actions/upload-artifact@v7
        with:
          name: green-key-v1-ci-${{ needs.classify.outputs.green_key }}
          path: artifacts/green-key/marker.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    # A merge never deploys; a published release or a manual dispatch with deploy on does (task 529).
    # The job runs the same `dev deploy` an operator runs: publish, aspire deploy, migrate when the
    # app has a database, smoke. --yes because nobody can answer a prompt here; --no-browser prints
    # the URL. Hosted runner: aspire deploy builds the images with Docker.
    # Azure login is GitHub OIDC with no client secret. Federate the app registration on the subject
    # repo:<owner>/<repo>:environment:Production, which covers the release run (a tag ref) and the
    # dispatch. Add required reviewers to the Production environment to gate each deploy.
    # Repository variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_LOCATION,
    # AZURE_RESOURCE_GROUP; optional DEPLOY_TARGET (aca or aca-neon, default aca-neon) and
    # PASSKEY_RP_HOST. Secrets for aca-neon: NEON_POOLED_CONNECTION_STRING and
    # NEON_DIRECT_CONNECTION_STRING.
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 60
    # One deploy at a time, and a new one waits instead of cancelling a deploy half way.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write  # the OIDC token azure/login exchanges
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-ci
        with:
          aspire-cli: 'true'

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Values reach `dev deploy` as environment variables, never on the command line. An unset
      # variable or secret is left out instead of set empty, so it cannot override the AppHost's
      # committed configuration. dev deploy refuses a missing Neon connection string by name.
      - name: Deploy to Azure
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || 'aca-neon' }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          PASSKEY_RP_HOST: ${{ vars.PASSKEY_RP_HOST }}
          NEON_POOLED_CONNECTION_STRING: ${{ secrets.NEON_POOLED_CONNECTION_STRING }}
          NEON_DIRECT_CONNECTION_STRING: ${{ secrets.NEON_DIRECT_CONNECTION_STRING }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:DEPLOY_TARGET -notin @('aca', 'aca-neon')) {
            Write-Host "DEPLOY_TARGET is '$env:DEPLOY_TARGET'. This job deploys to Azure: aca or aca-neon."
            exit 1
          }
          $missing = @('AZURE_SUBSCRIPTION_ID', 'AZURE_LOCATION', 'AZURE_RESOURCE_GROUP') |
            Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            Write-Host "Set the repository variables $($missing -join ', ') (tw-deploy, references/release-deploy.md)."
            exit 1
          }
          $env:Azure__SubscriptionId = $env:AZURE_SUBSCRIPTION_ID
          $env:Azure__Location = $env:AZURE_LOCATION
          $env:Azure__ResourceGroup = $env:AZURE_RESOURCE_GROUP
          if ($env:PASSKEY_RP_HOST) { ${env:Parameters__passkey-rp-host} = $env:PASSKEY_RP_HOST }
          if ($env:NEON_POOLED_CONNECTION_STRING) { ${env:Parameters__neon-pooled-connection-string} = $env:NEON_POOLED_CONNECTION_STRING }
          if ($env:NEON_DIRECT_CONNECTION_STRING) { ${env:Parameters__neon-direct-connection-string} = $env:NEON_DIRECT_CONNECTION_STRING }
          dotnet run --file tools/dev-cli/dev.cs -- deploy --target $env:DEPLOY_TARGET --yes --no-browser
          exit $LASTEXITCODE
